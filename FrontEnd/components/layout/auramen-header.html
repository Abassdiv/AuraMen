<!-- ============ HEADER ============ -->
<header class="sticky top-0 z-40 bg-white border-b border-line">
  <div class="max-w-7xl mx-auto px-4 md:px-8">

    <!-- Desktop row (md and up) -->
    <div class="hidden md:flex items-center h-20">
      <!-- Right: Logo (first in RTL source order = right side) -->
      <div class="flex-shrink-0">
        <a href="auramen_home.html" class="flex items-center gap-2 group" aria-label="AuraMen — الصفحة الرئيسية">
          <span class="font-inter text-2xl font-bold tracking-wide text-neutral-900">AuraMen</span>
          <span class="w-1.5 h-1.5 rounded-full bg-gold-500 mb-3 transition-transform duration-300 group-hover:scale-125"></span>
        </a>
      </div>

      <!-- Center: Nav -->
      <nav class="flex-1 flex items-center justify-center gap-10" aria-label="التنقل الرئيسي">
        <a href="#" class="nav-link text-[15px] font-medium text-neutral-900">جديدنا</a>
        <a href="#" class="nav-link text-[15px] font-medium text-neutral-900">قمصان</a>
        <a href="#" class="nav-link text-[15px] font-medium text-neutral-900">بنطال</a>
        <a href="#" class="nav-link text-[15px] font-medium text-neutral-900">إطلالات كاملة</a>
        <a href="#" class="nav-link text-[15px] font-medium text-gold-500">تخفيضات</a>
      </nav>

      <!-- Left: Search, Wishlist, Cart -->
      <div class="flex-shrink-0 flex items-center gap-5">
        <!-- Search -->
        <div class="relative">
          <svg class="absolute top-1/2 -translate-y-1/2 right-3 w-4 h-4 text-muted pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="7"/><path stroke-linecap="round" d="m20 20-3.5-3.5"/>
          </svg>
          <input
            type="text"
            placeholder="ابحث عن منتج..."
            class="w-48 lg:w-60 h-10 rounded-control border border-line bg-sand-50 pr-9 pl-3 text-sm text-neutral-900 placeholder:text-muted focus:bg-white focus:border-gold-500 outline-none transition-colors"
          >
        </div>

        <!-- Wishlist -->
        <button type="button" aria-label="المفضلة" class="relative w-10 h-10 flex items-center justify-center rounded-control hover:bg-sand-50 transition-colors">
          <svg class="w-5 h-5 text-neutral-900" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 20s-7-4.35-9.5-8.8C.7 7.6 2.2 4 5.6 4c2 0 3.4 1.1 4.4 2.6C11 5.1 12.4 4 14.4 4c3.4 0 4.9 3.6 3.1 7.2C19 15.65 12 20 12 20Z"/>
          </svg>
          <span class="num absolute -top-1 -left-1 min-w-[18px] h-[18px] px-1 rounded-full bg-gold-500 text-white text-[10px] font-semibold flex items-center justify-center">2</span>
        </button>

        <!-- Cart -->
        <button type="button" aria-label="سلة المشتريات" class="relative w-10 h-10 flex items-center justify-center rounded-control hover:bg-sand-50 transition-colors">
          <svg class="w-5 h-5 text-neutral-900" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 8h12l-1 12H7L6 8Z"/>
            <path stroke-linecap="round" d="M9 8V6a3 3 0 0 1 6 0v2"/>
          </svg>
          <span class="num absolute -top-1 -left-1 min-w-[18px] h-[18px] px-1 rounded-full bg-neutral-900 text-white text-[10px] font-semibold flex items-center justify-center">3</span>
        </button>
      </div>
    </div>

    <!-- Mobile row (below md) -->
    <div class="flex md:hidden items-center h-16 relative">
      <!-- Hamburger (right side in RTL) -->
      <button id="openDrawerBtn" type="button" aria-label="فتح القائمة" aria-expanded="false" aria-controls="drawer"
        class="w-10 h-10 -mr-2 flex items-center justify-center rounded-control hover:bg-sand-50 transition-colors">
        <svg class="w-6 h-6 text-neutral-900" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7">
          <path stroke-linecap="round" d="M4 7h16M4 12h16M4 17h16"/>
        </svg>
      </button>

      <!-- Centered logo -->
      <a href="auramen_home.html" class="absolute left-1/2 -translate-x-1/2 flex items-center gap-1.5" aria-label="AuraMen — الصفحة الرئيسية">
        <span class="font-inter text-lg font-bold tracking-wide text-neutral-900">AuraMen</span>
        <span class="w-1 h-1 rounded-full bg-gold-500 mb-2"></span>
      </a>

      <!-- Cart (left side in RTL, pushed via margin-inline-start auto) -->
      <button type="button" aria-label="سلة المشتريات" class="relative w-10 h-10 -ml-2 mr-0 ms-auto flex items-center justify-center rounded-control hover:bg-sand-50 transition-colors">
        <svg class="w-5 h-5 text-neutral-900" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 8h12l-1 12H7L6 8Z"/>
          <path stroke-linecap="round" d="M9 8V6a3 3 0 0 1 6 0v2"/>
        </svg>
        <span class="num absolute -top-1 -left-1 min-w-[16px] h-[16px] px-1 rounded-full bg-neutral-900 text-white text-[9px] font-semibold flex items-center justify-center">3</span>
      </button>
    </div>

  </div>
</header>

<!-- ============ MOBILE DRAWER + OVERLAY ============ -->
<!-- Overlay -->
<div id="overlay" class="fixed inset-0 z-40 bg-neutral-900/40 opacity-0 pointer-events-none md:hidden"></div>

<!-- Drawer: slides in from the right (RTL edge) -->
<aside id="drawer"
  class="fixed inset-y-0 right-0 z-50 w-[82%] max-w-sm bg-white translate-x-full md:hidden flex flex-col"
  role="dialog" aria-modal="true" aria-label="قائمة التنقل">

  <!-- Drawer header -->
  <div class="flex items-center justify-between h-16 px-5 border-b border-line flex-shrink-0">
    <div class="flex-shrink-0">
      <a href="auramen_home.html" class="flex items-center gap-2 group" aria-label="AuraMen — الصفحة الرئيسية">
        <span class="font-inter text-2xl font-bold tracking-wide text-neutral-900">AuraMen</span>
        <span
          class="w-1.5 h-1.5 rounded-full bg-gold-500 mb-3 transition-transform duration-300 group-hover:scale-125"></span>
      </a>
    </div>
    <button id="closeDrawerBtn" type="button" aria-label="إغلاق القائمة" class="w-9 h-9 flex items-center justify-center rounded-control hover:bg-sand-50 transition-colors">
      <svg class="w-5 h-5 text-neutral-900" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
        <path stroke-linecap="round" d="m6 6 12 12M18 6 6 18"/>
      </svg>
    </button>
  </div>

  <!-- Drawer search -->
  <div class="px-5 pt-4">
    <div class="relative">
      <svg class="absolute top-1/2 -translate-y-1/2 right-3 w-4 h-4 text-muted pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"/><path stroke-linecap="round" d="m20 20-3.5-3.5"/>
      </svg>
      <input type="text" placeholder="ابحث عن منتج..."
        class="w-full h-11 rounded-control border border-line bg-sand-50 pr-9 pl-3 text-sm text-neutral-900 placeholder:text-muted focus:bg-white focus:border-gold-500 outline-none transition-colors">
    </div>
  </div>

  <!-- Drawer nav links -->
  <nav class="flex-1 overflow-y-auto px-5 pt-6" aria-label="التنقل الرئيسي - جوال">
    <ul class="flex flex-col divide-y divide-line">
      <li><a href="#" class="block py-4 text-base font-medium text-neutral-900">جديدنا</a></li>
      <li><a href="#" class="block py-4 text-base font-medium text-neutral-900">قمصان</a></li>
      <li><a href="#" class="block py-4 text-base font-medium text-neutral-900">بنطال</a></li>
      <li><a href="#" class="block py-4 text-base font-medium text-neutral-900">إطلالات كاملة</a></li>
      <li><a href="#" class="block py-4 text-base font-medium text-gold-500">تخفيضات</a></li>
    </ul>
  </nav>

  <!-- Drawer footer: wishlist -->
  <div class="px-5 py-5 border-t border-line flex-shrink-0">
    <a href="#" class="flex items-center gap-3 text-sm font-medium text-neutral-900">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 20s-7-4.35-9.5-8.8C.7 7.6 2.2 4 5.6 4c2 0 3.4 1.1 4.4 2.6C11 5.1 12.4 4 14.4 4c3.4 0 4.9 3.6 3.1 7.2C19 15.65 12 20 12 20Z"/>
      </svg>
      المفضلة
      <span class="num mr-auto min-w-[20px] h-5 px-1.5 rounded-full bg-gold-500 text-white text-[11px] font-semibold flex items-center justify-center">2</span>
    </a>
  </div>
</aside>
