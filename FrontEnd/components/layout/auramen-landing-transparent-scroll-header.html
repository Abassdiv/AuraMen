<header id="siteHeader" data-scrolled="false" class="fixed top-0 inset-x-0 z-40 border-b">
  <div class="max-w-7xl mx-auto px-4 md:px-8 h-16 md:h-20 flex items-center justify-between">

    <a href="FrontEnd/components/pages/auramen_home.html" class="hdr-ink flex items-center gap-2" aria-label="AuraMen — الصفحة الرئيسية">
      <span class ="font-inter text-lg md:text-2xl font-bold tracking-wide">AuraMen</span>
      <span class="w-1.5 h-1.5 rounded-full bg-gold-500"></span>
    </a>


    <div class="flex items-center gap-1 md:gap-2">
      <button type="button" id="searchToggleBtn" aria-label="بحث" class="hdr-icon-btn hdr-ink w-10 h-10 flex items-center justify-center rounded-full">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7">
          <circle cx="11" cy="11" r="7"/><path stroke-linecap="round" d="m20 20-3.5-3.5"/>
        </svg>
      </button>
      <a href="FrontEnd/components/pages/auth.html" aria-label="تسجيل الدخول / حسابي" class="hdr-icon-btn hdr-ink w-10 h-10 flex items-center justify-center rounded-full">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7">
          <circle cx="12" cy="8" r="3.4"/>
          <path stroke-linecap="round" d="M5.5 20c1.2-3.4 4-5 6.5-5s5.3 1.6 6.5 5"/>
        </svg>
      </a>
    </div>

  </div>

  <!-- Search Modal -->
  <div id="searchModal" class="fixed inset-0 z-50 hidden">
    <!-- Backdrop -->
    <div id="searchBackdrop" class="absolute inset-0 bg-black/60 backdrop-blur-sm transition-opacity opacity-0"></div>
    <!-- Modal Content -->
    <div class="absolute inset-0 flex items-start justify-center pt-16 md:pt-24 px-4">
      <div id="searchModalContent" class="w-full max-w-3xl bg-white rounded-2xl shadow-2xl transform scale-95 opacity-0 transition-all duration-300">
        <div class="p-4 md:p-6">
          <!-- Search Header -->
          <div class="flex items-center gap-3 mb-4">
            <svg class="w-6 h-6 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="7"/><path stroke-linecap="round" d="m20 20-3.5-3.5"/>
            </svg>
            <input 
              type="text" 
              id="searchInput"
              placeholder="ابحث عن منتجات، علامات تجارية، وأكثر..." 
              class="flex-1 text-lg md:text-xl outline-none placeholder-gray-400 text-gray-800"
              dir="rtl"
            >
            <button 
              id="closeSearchBtn" 
              type="button" 
              aria-label="إغلاق البحث"
              class="p-2 hover:bg-gray-100 rounded-full transition-colors"
            >
              <svg class="w-6 h-6 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
              </svg>
            </button>
          </div>
          <!-- Search Results Placeholder -->
          <div id="searchResults" class="hidden">
            <div class="border-t pt-4">
              <p class="text-gray-500 text-center py-8">ابدأ بالكتابة للبحث...</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>
